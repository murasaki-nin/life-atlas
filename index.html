 event.preventDefault();const error=document.getElementById('error');error.textContent='';
 try{
  const value=document.getElementById('key').value.trim().replace(/-/g,'+').replace(/_/g,'/');
  const raw=bytes(value.padEnd(Math.ceil(value.length/4)*4,'='));
  if(raw.length!==32)throw Error('密钥格式不正确');
  const key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));
  const html=new TextDecoder().decode(plain);
  document.open();document.write(html);document.close();
 }catch(e){error.textContent='无法解锁。请检查访问密钥后重试。'}
